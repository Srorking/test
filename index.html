<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank you, Prime Tech Solution — Ibrahim</title>
  <meta name="description" content="Today is my last day at Prime Tech Solution. A small thank-you to everyone who supported me, worked with me, and became a friend.">
  <meta name="theme-color" content="#04060d">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://srorking.github.io/test/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Thank you, Prime Tech family — Ibrahim">
  <meta property="og:description" content="Today is my last day at Prime Tech Solution. A small thank-you to everyone who supported me, worked with me, and became a friend.">
  <meta property="og:url" content="https://srorking.github.io/test/">
  <meta property="og:image" content="https://srorking.github.io/test/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://srorking.github.io/test/og.jpg">

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" id="favicon">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="loader" id="loader" role="status">
    <div class="loader-logo"><img data-logo src="assets/logo.svg" alt=""></div>
    <div class="loader-bar"><i></i></div>
    <p data-t="loading">Loading the thank-you…</p>
  </div>

  <!-- Layered background: aurora -> grid -> WebGL scene -> grain -->
  <div class="bg" aria-hidden="true">
    <i class="aurora a1"></i><i class="aurora a2"></i><i class="aurora a3"></i><i class="grid"></i>
  </div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="spot" id="spot" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="brand" href="#top" aria-label="Prime Tech Solution">
      <img class="brand-logo" data-logo src="assets/logo.svg" alt="">
      <span class="brand-name" data-t="brand">Ibrahim</span>
    </a>
    <nav class="nav-links" aria-label="Sections">
      <a href="#journey" data-t="nav.journey">Journey</a>
      <a href="#thanks" data-t="nav.thanks">Thank you</a>
      <a href="#wall" data-t="nav.wall">Wall of thanks</a>
      <a href="#ai" data-t="nav.ai">Team AI</a>
      <a href="#message" data-t="nav.message">My note</a>
    </nav>
    <button class="lang" id="langBtn" type="button" aria-label="Switch language / تغيير اللغة">
      <span class="lang-thumb"></span><b>EN</b><b>عربي</b>
    </button>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero" id="hero" data-scene="hero">
      <div class="container">
        <div class="hero-inner" id="heroInner">
          <div class="hero-top hi" style="--hd:0">
            <span class="hero-logo"><img data-logo src="assets/logo.svg" alt="Prime Tech Solution"></span>
            <p class="pill"><span class="dot"></span><span id="heroEyebrow"></span></p>
          </div>
          <h1 class="hero-title" id="heroTitle">
            <span class="line l1" data-split="hero.title1" data-mode="chars"></span>
            <span class="line l2 grad" data-split="hero.title2"></span>
          </h1>
          <p class="hero-sub hi" style="--hd:5" data-t="hero.sub"></p>
          <div class="hero-cta hi" style="--hd:6">
            <a class="btn primary magnetic" href="#message">
              <span data-t="hero.cta1"></span>
              <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <button class="btn ghost magnetic" type="button" data-love>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.6 2.6 5 6.2 5c2 0 3.4 1 4.4 2.400h.8C12.400 6 13.800 5 15.800 5c3.600 0 5.300 3.600 3.800 6.800C19.500 16.400 12 21 12 21z"/></svg>
              <span data-t="hero.cta2"></span>
            </button>
          </div>
        </div>
      </div>
      <a class="scroll-hint hi" style="--hd:8" href="#journey">
        <span class="mouse"><i></i></span><span data-t="hero.scroll"></span>
      </a>
    </section>

    <!-- JOURNEY -->
    <section class="section" id="journey" data-scene="journey">
      <div class="container">
        <div class="col-start">
          <header class="sec-head reveal">
            <p class="eyebrow" data-t="journey.eyebrow"></p>
            <h2 data-t="journey.title"></h2>
          </header>
          <ol class="timeline" id="timeline"></ol>
        </div>
      </div>
    </section>

    <!-- THANK YOU CARDS -->
    <section class="section" id="thanks" data-scene="thanks">
      <div class="container">
        <header class="sec-head center reveal">
          <p class="eyebrow" data-t="thanks.eyebrow"></p>
          <h2 data-t="thanks.title"></h2>
          <p class="lead" data-t="thanks.lead"></p>
        </header>
        <div class="cards" id="cards"></div>
      </div>
    </section>

    <div class="band" aria-hidden="true"><div class="band-track" id="bandTrack"></div></div>

    <!-- WALL OF THANKS (3D name sphere) -->
    <section class="section" id="wall" data-scene="wall">
      <div class="container">
        <header class="sec-head center reveal">
          <p class="eyebrow" data-t="wall.eyebrow"></p>
          <h2 data-t="wall.title"></h2>
        </header>
        <div class="sphere-wrap reveal">
          <div class="sphere" id="sphere" role="list"></div>
          <p class="hint">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.700"/><path d="M21 3v5h-5"/></svg>
            <span data-t="wall.hint"></span>
          </p>
        </div>
        <p class="note reveal" data-t="wall.note"></p>
      </div>
    </section>

    <!-- TEAM AI (special) -->
    <section class="section ai" id="ai" data-scene="ai">
      <canvas id="neural" aria-hidden="true"></canvas>
      <div class="container">
        <header class="sec-head center reveal">
          <p class="eyebrow ai-eyebrow"><span class="chip-ai">AI</span><span data-t="ai.eyebrow"></span></p>
          <h2><span data-t="ai.title1"></span> <span class="grad-ai" data-t="ai.title2"></span></h2>
          <p class="lead" data-t="ai.lead"></p>
        </header>

        <div class="ai-grid">
          <div class="terminal reveal" id="terminal" dir="ltr">
            <div class="term-bar"><i></i><i></i><i></i><span>team-ai — thank-you.sh</span></div>
            <div class="term-body" id="termBody"></div>
          </div>
          <div class="ai-cards" id="aiCards"></div>
        </div>

        <div class="ai-members reveal" id="aiMembers" hidden>
          <p data-t="ai.members"></p>
          <div class="chips" id="aiChips"></div>
        </div>
        <p class="ai-tag reveal"><span class="dot"></span><span data-t="ai.tag"></span></p>
      </div>
    </section>

    <!-- MESSAGE -->
    <section class="section" id="message" data-scene="message">
      <div class="container">
        <div class="msg-col">
          <div class="reveal">
            <article class="letter tilt" data-tilt="4">
              <span class="card-bg"></span>
              <p class="eyebrow" data-t="message.eyebrow"></p>
              <h2 data-t="message.title"></h2>
              <div id="letterBody"></div>
            </article>
          </div>
        </div>
      </div>
    </section>

    <!-- FINALE -->
    <section class="section finale" id="finale" data-scene="finale">
      <div class="container center">
        <p class="eyebrow reveal" data-t="finale.eyebrow"></p>
        <h2 class="finale-title reveal"><span data-t="finale.title1"></span> <span class="grad" data-t="finale.title2"></span></h2>
        <p class="lead reveal" data-t="finale.sub"></p>
        <div class="finale-cta reveal">
          <button class="btn primary big magnetic" type="button" data-love id="finaleLove">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.6 2.6 5 6.2 5c2 0 3.4 1 4.4 2.400h.8C12.400 6 13.800 5 15.800 5c3.600 0 5.300 3.600 3.800 6.800C19.500 16.400 12 21 12 21z"/></svg>
            <span data-t="finale.love"></span>
          </button>
          <div class="links" id="links"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img class="footer-logo" data-logo src="assets/logo.svg" alt="">
    <p id="footerText"></p>
    <a class="totop" href="#top" data-t="finale.top"></a>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This page needs JavaScript to show the thank-you. Thank you anyway! — Ibrahim</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
